<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{box-sizing:border-box}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><title>Field Measure</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#15181b">

<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: full-height field tool — drawing surface on top, data panel below, keypad rises as a sheet */
:root{
  --bg:#f1f3f2; --surface:#ffffff; --surface-2:#e9ecea;
  --ink:#15181b; --ink-2:#5b6670; --line:#d3d9d6;
  --accent:#ff5a1f; --accent-ink:#ffffff;
  --ok:#1b7a4c; --miss:#c42b1c; --grid:#e3e8e5;
  --display:"Barlow Condensed",'Arial Narrow',sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --num:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13161a; --surface:#1c2126; --surface-2:#262c33;
  --ink:#edf1f3; --ink-2:#95a1aa; --line:#2d353d;
  --accent:#ff7a45; --accent-ink:#1a0d06;
  --ok:#49bd82; --miss:#ff6d5c; --grid:#242b31;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#13161a; --surface:#1c2126; --surface-2:#262c33;
  --ink:#edf1f3; --ink-2:#95a1aa; --line:#2d353d;
  --accent:#ff7a45; --accent-ink:#1a0d06;
  --ok:#49bd82; --miss:#ff6d5c; --grid:#242b31;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}

header{background:var(--ink);color:var(--bg);padding:9px 16px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex:0 0 auto}
header h1{font-family:var(--display);font-size:21px;letter-spacing:.06em;text-transform:uppercase;margin:0;font-weight:700}
#hdr{display:flex;align-items:center;gap:8px;min-width:0}
#sync{font-family:var(--body);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;
  color:var(--bg);opacity:.6;white-space:nowrap}
#sync.ok{opacity:.75}
#sync.warn{opacity:1;color:#ffd4c2}
#jobbtn{font-family:var(--body);font-size:12px;color:var(--bg);background:none;border:1px solid currentColor;
  border-radius:6px;padding:4px 9px;max-width:52vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.9}
#modal{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:30}
#modal[hidden]{display:none!important}
#modalbox{width:100%;background:var(--surface);border-radius:14px 14px 0 0;
  padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));
  max-height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.mtitle{font-family:var(--display);font-size:19px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.jrow{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:11px 0}
.jopen{flex:1;min-width:0;background:none;border:none;text-align:left;color:inherit;padding:0}
.jopen b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jopen small{display:block;color:var(--ink-2);font-size:12px;margin-top:2px}
.jcur b{color:var(--accent)}
.jdel{flex:0 0 auto;background:none;border:1px solid var(--line);border-radius:8px;color:var(--ink-2);padding:7px 11px;font-size:15px}
.confirm{display:flex;flex-direction:column;gap:9px;border-bottom:1px solid var(--line);padding:12px 0}
.confirm .warn{font-size:13.5px;line-height:1.45;color:var(--ink)}
.confirm .warn b{color:var(--miss)}
.crow{display:flex;gap:8px}
.mbtn{border:none;border-radius:9px;padding:13px 10px;font-family:var(--display);font-size:16px;
  letter-spacing:.06em;text-transform:uppercase;font-weight:700;flex:1}
.mprimary{background:var(--accent);color:var(--accent-ink)}
.msecondary{background:var(--surface-2);color:var(--ink-2)}
.mdanger{background:var(--miss);color:#fff}
.chk{font-family:var(--body);font-size:12px;line-height:1.45;color:var(--ink-2);padding:6px 0 2px}
.chk.ok{color:var(--ok);font-weight:600}
.chk.bad{color:var(--miss);font-weight:600}
#jobnameinput{font-family:var(--body);font-size:16px;padding:12px;border:2px solid var(--line);
  border-radius:9px;background:var(--surface-2);color:var(--ink);width:100%}

#modebar{display:flex;gap:1px;background:var(--line);flex:0 0 auto}
.mode{flex:1;background:var(--surface);color:var(--ink-2);border:none;padding:11px 4px 9px;font-family:var(--display);font-size:16px;letter-spacing:.07em;text-transform:uppercase;font-weight:600}
.mode[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
#shapebar{flex:0 0 auto;display:flex;gap:6px;padding:6px 10px;background:var(--surface);
  border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
.chip{flex:0 0 auto;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);
  border-radius:999px;padding:5px 13px;font-size:13px;font-weight:600;font-family:var(--body)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.add{color:var(--accent);border-color:var(--accent);background:none;font-weight:700}
#hint{flex:0 0 auto;background:var(--surface-2);color:var(--ink-2);font-size:12px;line-height:1.35;padding:7px 16px;border-bottom:1px solid var(--line)}

#stage{position:relative;flex:1 1 auto;min-height:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
#stagebtns{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:8px}
.sbtn{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:44px;font-family:var(--display);font-size:15px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.14)}
.sbtn[hidden]{display:none!important}
.sbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sbtn.off{opacity:.38}
#lock{line-height:0;padding:9px 10px}

#lock svg{display:block;width:19px;height:19px;margin:0 auto}

#tools{position:absolute;left:0;right:0;bottom:0;z-index:9;display:flex;gap:6px;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));overflow-x:auto;white-space:nowrap;
  background:linear-gradient(to top,var(--surface) 70%,transparent)}
#tools[hidden]{display:none!important}
#tools .chip{flex:0 0 auto;box-shadow:0 1px 3px rgba(0,0,0,.14)}
#panel{position:absolute;left:0;right:0;bottom:0;z-index:10;
  max-height:80%;background:var(--surface);border-top:1px solid var(--line);
  border-radius:13px 13px 0 0;box-shadow:0 -7px 22px rgba(0,0,0,.16);
  display:flex;flex-direction:column}
#grip{flex:0 0 auto;height:4px;width:38px;border-radius:2px;background:var(--line);margin:7px auto 3px}
#tabs{display:flex;border-bottom:1px solid var(--line);flex:0 0 auto}
.tab{flex:1;min-width:0;background:none;border:none;padding:10px 2px 8px;font-family:var(--display);font-size:14px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;color:var(--ink-2);border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
#view{flex:1 1 auto;min-height:0;overflow-y:auto;padding:4px 16px 14px}

.tally{font-family:var(--display);font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);padding:9px 0 5px;position:sticky;top:0;background:var(--surface)}
.tally.done{color:var(--ok)}
.sub{font-family:var(--display);font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);padding:12px 0 2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;background:none;border:none;border-bottom:1px solid var(--line);padding:10px 0;text-align:left;color:inherit}
.row:last-child{border-bottom:none}
.row.indent{padding-left:14px}
.lbl{font-size:14px;min-width:0}
.lbl small{display:block;color:var(--ink-2);font-size:11.5px}
.val{font-family:var(--num);font-size:14.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.val.empty{color:var(--miss);font-family:var(--body);font-weight:500;font-size:13px}
.empty-state{color:var(--ink-2);font-size:13.5px;line-height:1.5;padding:14px 0}
pre#sumtext{font-family:var(--num);font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;margin:6px 0 0;color:var(--ink)}
#copy{margin-top:12px;width:100%;background:var(--ink);color:var(--bg);border:none;border-radius:8px;padding:11px;font-family:var(--display);font-size:16px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.sendrow{display:flex;gap:8px;margin-top:8px}
.sendrow button{flex:1;border:none;border-radius:8px;padding:11px 6px;font-family:var(--display);
  font-size:16px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.sendrow .primary{background:var(--accent);color:var(--accent-ink)}
.sendrow .second{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
#shotwrap{margin-top:12px}
#shotwrap img{display:block;width:100%;border:1px solid var(--line);border-radius:8px}
#shotwrap .cap{font-family:var(--body);font-size:12.5px;color:var(--ink-2);padding:7px 2px 0;line-height:1.45}
#fullshot{position:fixed;inset:0;z-index:70;background:#fff;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:10px}
#fullshot[hidden]{display:none!important}
#fullshot .stage{position:relative;flex:1 1 auto;width:100%;min-height:0}
#fullshot img{position:absolute;left:50%;top:50%;transform-origin:center center}
#review{position:fixed;inset:0;z-index:65;background:var(--bg);display:flex;flex-direction:column}
#review[hidden]{display:none!important}
#revbox{flex:1 1 auto;overflow-y:auto;padding:16px 16px 8px}
#revclose{flex:0 0 auto;margin:8px 16px calc(14px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--bg);border:none;border-radius:9px;padding:13px;
  font-family:var(--display);font-size:17px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.rvtitle{font-family:var(--display);font-size:24px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;padding-bottom:2px}
.rvsub{font-family:var(--body);font-size:12.5px;color:var(--ink-2);padding-bottom:12px;line-height:1.45}
.rvhead{font-family:var(--display);font-size:14px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-2);font-weight:700;padding:16px 0 4px;border-bottom:1px solid var(--line);margin-bottom:4px}
.rvline{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:7px 0}
.rvline .k{font-family:var(--body);font-size:14px;color:var(--ink-2);white-space:nowrap}
.rvline .v{font-family:var(--num);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.rvline .v.gone{color:var(--miss);font-family:var(--body);font-size:14px;font-weight:500}
.rvline small{display:block;font-family:var(--body);font-size:11.5px;color:var(--ink-2);font-weight:400}
.rvnote{font-family:var(--body);font-size:12.5px;color:var(--ink-2);line-height:1.5;padding:4px 0 2px}
.rvnote.ok{color:var(--ok);font-weight:600}
.rvflags{background:var(--surface);border:2px solid var(--miss);border-radius:11px;padding:10px 12px;margin-bottom:6px}
.rvflags .h{font-family:var(--display);font-size:16px;letter-spacing:.06em;text-transform:uppercase;
  font-weight:700;color:var(--miss);padding-bottom:4px}
.rvflag{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;
  border-top:1px solid var(--line);padding:11px 0;text-align:left}
.rvflag b{display:block;font-family:var(--body);font-size:14.5px;font-weight:600}
.rvflag small{display:block;font-family:var(--body);font-size:12px;color:var(--ink-2);line-height:1.4;padding-top:2px}
.rvacts{flex:0 0 auto;display:flex;flex-direction:column;gap:6px}
.rvact{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 11px;
  font-family:var(--display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;
  color:var(--ink-2);white-space:nowrap}
.rvact.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
#fullshot .fcap{font-family:var(--body);font-size:13px;color:#5b6670;text-align:center;padding:12px 16px 0}

#statusrow{flex:0 0 auto;display:flex;align-items:stretch;gap:8px;border-top:1px solid var(--line);
  background:var(--surface-2);padding:9px 14px;padding-bottom:calc(9px + env(safe-area-inset-bottom,0px))}
#status{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:10px;
  border:none;background:none;text-align:left;padding:2px 0;
  font-family:var(--body);font-size:12.5px;color:var(--ink-2)}
#backbtn,#revbtn{flex:0 0 auto;background:none;color:var(--ink);border:1px solid var(--ink-2);
  border-radius:8px;padding:7px 11px;font-family:var(--body);font-size:12.5px;font-weight:600;line-height:1.3}
#revbtn{font-size:16px;line-height:1.05;padding:6px 10px}
#backbtn.off,#revbtn.off{color:var(--ink-2);border-color:var(--line);opacity:.4}
#statustext{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#findbtn{flex:0 0 auto;background:var(--miss);color:#fff;border:none;border-radius:8px;padding:7px 13px;
  font-family:var(--display);font-size:14px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
#status.clear{color:var(--ok)}
#caret{font-size:11px;opacity:.65;flex:0 0 auto}

#sheet{position:absolute;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;z-index:20}
#sheet[hidden]{display:none!important}
#sheetbox{width:100%;background:var(--surface);border-radius:14px 14px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:9px;max-height:100%;overflow-y:auto}
#sheettitle{font-family:var(--display);font-size:19px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
#kinds{display:flex;flex-wrap:wrap;gap:6px}
#kinds[hidden]{display:none!important}
#flagrow{display:flex;gap:6px}
#flagrow[hidden]{display:none!important}
.kchip{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);border-radius:999px;
  padding:7px 13px;font-family:var(--body);font-size:13px;font-weight:600}
.kchip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#fields{display:flex;flex-direction:column;gap:11px}
#spanview{padding:2px 0 2px}
#spanview[hidden]{display:none!important}
#spanview svg{display:block;width:100%;height:auto}
#spanview .cap{font-family:var(--body);font-size:11.5px;color:var(--ink-2);padding-top:3px}
.slot{display:flex;flex-direction:column;gap:5px}
.slotname{font-family:var(--display);font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.boxes{display:flex;gap:7px}
.box{flex:1;min-width:0;background:var(--surface-2);border:2px solid transparent;border-radius:9px;padding:7px 9px;text-align:left;color:inherit}
.box.on{border-color:var(--accent)}
.box b{display:block;font-family:var(--display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.box span{font-family:var(--num);font-size:19px;font-weight:600;display:block;min-height:25px;overflow:hidden}
.slotout{font-family:var(--num);font-size:16px;font-weight:600;color:var(--accent);padding-left:2px}
.slotalt{font-family:var(--num);font-size:12.5px;font-weight:500;color:var(--ink-2)}
#pad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
#pad button{background:var(--surface-2);color:var(--ink);border:none;border-radius:9px;padding:14px 2px;font-family:var(--num);font-size:19px;font-weight:600}
#pad button.aux{font-family:var(--display);font-size:17px;letter-spacing:.05em}
#fracs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
#fracs button{background:var(--surface-2);color:var(--ink-2);border:none;border-radius:9px;padding:10px 2px;font-family:var(--num);font-size:14px;font-weight:600}
#sheetacts{display:flex;gap:8px}
#sheetacts button{flex:1;border:none;border-radius:9px;padding:13px;font-family:var(--display);font-size:17px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
#cancel{background:var(--surface-2);color:var(--ink-2)}
#removebtn{background:none;border:1px solid var(--miss);color:var(--miss);border-radius:9px;
  padding:11px;font-family:var(--display);font-size:15px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
#save{background:var(--accent);color:var(--accent-ink)}
button{font-size:16px;cursor:pointer}
button:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){#sheetbox{animation:rise .16s ease-out}@keyframes rise{from{transform:translateY(18px)}}}
</style>

<div id="app">
  <header>
    <h1>Field Measure</h1>
    <span id="hdr"><span id="sync">local</span><button id="jobbtn">Job 1</button></span>
  </header>

  <div id="modebar">
    <button class="mode" data-mode="draw" aria-pressed="true">Draw</button>
    <button class="mode" data-mode="measure" aria-pressed="false">Measure</button>
    <button class="mode" data-mode="open" aria-pressed="false">Openings</button>
  </div>
  <div id="shapebar"></div>
  <div id="hint"></div>

  <div id="stage">
    <canvas id="c"></canvas>
    <div id="stagebtns">
      <button class="sbtn" id="fit">Fit</button>
      <button class="sbtn" id="lock" aria-label="Lock the drawing"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 10.9V7.9a3.5 3.5 0 0 1 5.98-2.47"/><rect x="5.1" y="10.9" width="13.8" height="9.3" rx="1.7"/><circle cx="12" cy="15.5" r="1.15" fill="currentColor" stroke="none"/></svg></button>
      <button class="sbtn" id="undo">Undo</button>
      <button class="sbtn" id="redo" hidden>Redo</button>
    </div>
    <div id="tools" hidden>
      <button class="chip" id="snap">90&deg;</button>
      <button class="chip" id="close" hidden>Close shape</button>
      <button class="chip" id="align">Align</button>
      <button class="chip" id="jog">Jog</button>
      <button class="chip" id="cut">45&deg; cut</button>
      <button class="chip" id="erase">Erase wall</button>
    </div>

  <div id="panel">
    <div id="grip"></div>
    <div id="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="walls" aria-selected="true">Walls</button>
      <button class="tab" role="tab" data-tab="openings" aria-selected="false">Openings</button>
      <button class="tab" role="tab" data-tab="heights" aria-selected="false">Heights</button>
      <button class="tab" role="tab" data-tab="summary" aria-selected="false">Summary</button>
    </div>
    <div id="view"></div>
  </div>
  </div>

  <div id="statusrow">
    <button id="status"><span id="statustext"></span><span id="caret"></span></button>
    <button id="backbtn" hidden>Back</button>
    <button id="revbtn" hidden aria-label="Go the other way round">&#8630;</button>
    <button id="findbtn" hidden>Find it</button>
  </div>

  <div id="modal" hidden><div id="modalbox"></div></div>

  <div id="fullshot" hidden></div>
  <div id="review" hidden><div id="revbox"></div><button id="revclose">Done</button></div>

  <div id="sheet" hidden>
    <div id="sheetbox">
      <div id="sheettitle"></div>
      <div id="spanview" hidden></div>
      <div id="kinds"></div>
      <div id="flagrow" hidden></div>
      <div id="fields"></div>
      <div id="fracs"></div>
      <div id="pad"></div>
      <div id="sheetacts">
        <button id="cancel">Cancel</button>
        <button id="save">Save</button>
      </div>
      <button id="removebtn" hidden>Remove this opening</button>
    </div>
  </div>
</div>

    var o=localStorage.getItem(OLD);
    if(o){var od=JSON.parse(o);
      if(od&&od.pts){var j=blankJob('Job 1');
        j.pts=od.pts||[];j.closed=!!od.closed;j.walls=od.walls||[];j.openings=od.openings||[];
        j.heights=od.heights||{};if(od.snap!==undefined)j.snap=od.snap;if(od.view)j.view=od.view;
        DB={jobs:[j],active:0};return;}}

function cur(){return DB.jobs[DB.active];}

  var j=cur();if(!j)return null;

    /* an older job kept one outline at the top level - lift it into the list */
    var sh=blankShape('House');
    sh.pts=j.pts||[];sh.closed=!!j.closed;sh.walls=j.walls||[];sh.openings=j.openings||[];
    j.shapes=[sh];j.active=0;

  S.heights=j.heights||(j.heights={});S.snap=(j.snap===undefined?90:j.snap);
  S.locked=!!j.locked;

  sh.pts=S.pts;sh.closed=S.closed;sh.walls=S.walls;sh.openings=S.openings;
  j.heights=S.heights;j.snap=S.snap;j.view=V;j.locked=!!S.locked;j.updated=Date.now();

function shapeSegs(sh){return (!sh.pts||sh.pts.length<2)?0:(sh.closed?sh.pts.length:sh.pts.length-1);}

  var e=document.getElementById('sync');if(!e)return;
  var txt={connecting:'syncing',saving:'saving',ok:'saved',local:'this device only',err:'not saved'}[mode]||'';
  e.textContent=txt;

  if(window.FMStore) FMStore.push(DB);

function initCloud(){
  if(!window.FMStore){setSync('local');return;}
  FMStore.init({
    onStatus:setSync,
    onRemote:function(rem){
      /* The server has a copy. Take it only if it is newer than what is on this
         phone, or if this phone has nothing drawn yet. */
      var mine=DB.updated||0, theirs=rem.updated||0;
      var mineHasWork=(DB.jobs||[]).some(function(j){
        return (j.shapes||[]).some(function(sh){return sh.pts&&sh.pts.length;})||(j.pts&&j.pts.length);
      });
      if(theirs>mine||!mineHasWork){
        DB=rem;
        try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}
        intoState();setMode(S.closed?'measure':'draw');fitView();render();

function stateStr(){
  return JSON.stringify({pts:S.pts,closed:S.closed,walls:S.walls,openings:S.openings});
}
function applyState(str){
  var d=JSON.parse(str);
  S.pts=d.pts;S.closed=d.closed;S.walls=d.walls;S.openings=d.openings;
}
function snapshot(){
  hist.push(stateStr());
  if(hist.length>60)hist.shift();
  future=[];            /* a fresh change means there's nothing to redo */
}
function undo(){
  if(!hist.length)return false;
  future.push(stateStr());
  if(future.length>60)future.shift();
  applyState(hist.pop());
  return true;
}
function redo(){
  if(!future.length)return false;
  hist.push(stateStr());
  applyState(future.pop());
  return true;
}
function filledNow(){

}

function segCount(){return S.pts.length<2?0:(S.closed?S.pts.length:S.pts.length-1);}
function seg(i){return[S.pts[i],S.pts[(i+1)%S.pts.length]];}

/* ---------- where openings sit along a wall ----------
   Measurements run from one end of the wall, and that end has to be the same
   every time or the numbers mean nothing. The drawing never rotates, so the
   top-left-most of the wall's two corners is a fixed, readable anchor. */
function wallStartCorner(w){
  var sg=seg(w),a=sg[0],b=sg[1];
  if(Math.abs(a.y-b.y)>0.5)return a.y<b.y?0:1;
  return a.x<=b.x?0:1;
}
function distFromStart(w,o){return wallStartCorner(w)===0?o.t:1-o.t;}
/* The openings on a wall, in the order you walk past them from that corner. */
function wallOpenings(w){
  var ix=[];
  S.openings.forEach(function(o,i){if(o.wall===w)ix.push(i);});
  ix.sort(function(p,q){return distFromStart(w,S.openings[p])-distFromStart(w,S.openings[q]);});
  return ix;
}
/* The run of gaps down a wall: corner to the first opening, opening to
   opening, last opening to the far corner. One more gap than openings. */
function gapChain(w){
  var ix=wallOpenings(w),rows=[];
  if(!ix.length)return rows;
  ix.forEach(function(i,k){
    rows.push({slot:k,open:i,
      from:k===0?'Corner':kindLabel(kindOf(S.openings[ix[k-1]])),
      to:kindLabel(kindOf(S.openings[i])),
      value:S.openings[i].gap||''});
  });
  rows.push({slot:ix.length,open:-1,
    from:kindLabel(kindOf(S.openings[ix[ix.length-1]])),to:'Corner',value:endGap(w)});
  return rows;
}
/* Gap by gap is the easy number to read off a tape, and its one weakness is
   that an error in the middle hides in the total. The app does the sum the
   tape can't: gaps plus opening widths have to come to the wall length. */
/* a wall carrying a guess is not a wall with a mistake on it */
function wallApprox(w){
  if(S.walls[w]&&S.walls[w].approx)return true;
  return wallOpenings(w).some(function(i){return !!S.openings[i].approx;});
}
function setWallApprox(w,v){
  if(!S.walls[w])S.walls[w]={};
  if(v)S.walls[w].approx=true;else delete S.walls[w].approx;
}
function gapCheck(w){
  var ix=wallOpenings(w);
  if(!ix.length)return null;
  var L=dim16(wallLen(w));
  if(!L)return{need:'length'};
  var sum=0,missing=0;
  ix.forEach(function(i){
    var o=S.openings[i];
    if(!o.gap)missing++;
    if(!o.w)missing++;
    sum+=dim16(o.gap)+dim16(o.w);
  });
  if(!endGap(w))missing++;
  sum+=dim16(endGap(w));

  return{diff:sum-L,len:L,sum:sum};
}
/* Once a wall's run is complete, the openings move to where the tape says
   they are. Until then they stay where they were dropped. */
function applyGaps(w){
  var c=gapCheck(w);
  if(!c||c.need)return false;
  var L=c.len,st=wallStartCorner(w),ix=wallOpenings(w),run=0;
  ix.forEach(function(i){
    var o=S.openings[i];
    run+=dim16(o.gap);
    var mid=run+dim16(o.w)/2;
    run+=dim16(o.w);
    var t=Math.max(0,Math.min(1,mid/L));
    o.t=(st===0)?t:1-t;
  });

/* ---------- canvas ---------- */
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=0,H=0;
function cssvar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fit(){
  var r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;
  if(!r.width||!r.height)return;
  if(Math.abs(r.width-W)<1&&Math.abs(r.height-H)<1){paint();return;}
  W=r.width;H=r.height;
  cv.width=Math.round(W*d);cv.height=Math.round(H*d);

window.addEventListener('resize',fit);
if(window.matchMedia)try{window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',paint);}catch(e){}

function ptOn(i,t){var s=seg(i);return{x:s[0].x+t*(s[1].x-s[0].x),y:s[0].y+t*(s[1].y-s[0].y)};}

  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();

function paint(){

  var gx=((V.ox%gs)+gs)%gs,gy=((V.oy%gs)+gs)%gs;

  for(var y=gy;y<H;y+=gs){ctx.beginPath();ctx.moveTo(0,Math.round(y)+.5);ctx.lineTo(W,Math.round(y)+.5);ctx.stroke();}

  var j0=cur();

    ctx.save();ctx.globalAlpha=.3;

      if(si===j0.active)return;
      var m=shapeSegs(sh);if(!m)return;
      ctx.strokeStyle=C.ink2;ctx.lineWidth=2.5;ctx.setLineDash([7,5]);
      for(var q=0;q<m;q++){

        ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
      }
      ctx.setLineDash([]);
      var cx=0,cy=0;sh.pts.forEach(function(q){var w=W2S(q);cx+=w.x;cy+=w.y;});
      cx/=sh.pts.length;cy/=sh.pts.length;
      ctx.fillStyle=C.ink2;ctx.font='600 13px "Barlow Condensed",sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(sh.name.toUpperCase(),cx,cy);
    });
    ctx.restore();
  }
  /* Markers are drawn at screen size, so zoomed out they swamp a busy
     outline. Shrink them with the zoom, down to a floor that stays visible. */
  var hs=Math.max(0.3,Math.min(1,V.s*1.15)), tiny=hs<0.55;
  /* The moment the markers start shrinking, the numbers go: that's the point
     where they stop being readable and start covering the shape. */

    var s=seg(i),has=!!wallLen(i),A=W2S(s[0]),B=W2S(s[1]);
    ctx.strokeStyle=has?C.ok:C.miss;ctx.lineWidth=Math.max(2.2,4*hs);
    ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke();
  }
  /* openings sit on their wall */
  for(var o=0;o<S.openings.length&&!bare;o++){
    var op=S.openings[o];if(op.wall>=n)continue;
    var p=W2S(ptOn(op.wall,op.t)),sg=seg(op.wall);
    var ang=Math.atan2(sg[1].y-sg[0].y,sg[1].x-sg[0].x);
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(ang);
    if(op.w&&op.h){
      var ow=Math.max(5,13*hs);
      ctx.strokeStyle=C.acc;ctx.lineWidth=Math.max(3,7*hs);ctx.lineCap='butt';
      ctx.beginPath();ctx.moveTo(-ow,0);ctx.lineTo(ow,0);ctx.stroke();
      if(!tiny){
        ctx.rotate(-ang);
        ctx.fillStyle=cssvar('--accent-ink');
        ctx.font='700 9px "Barlow Condensed",sans-serif';
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(kindGlyph(kindOf(op)),0,0.5);
        ctx.rotate(ang);

    }else{
      var ow2=Math.max(5,13*hs),oh2=Math.max(2.5,4.5*hs);
      ctx.fillStyle=C.surf;ctx.strokeStyle=C.miss;ctx.lineWidth=Math.max(1.4,2.2*hs);

    var s2=seg(j),A2=W2S(s2[0]),B2=W2S(s2[1]),mx=(A2.x+B2.x)/2,my=(A2.y+B2.y)/2;
    var L=showLen(wallLen(j));

      ctx.fillStyle=C.surf;rr(mx-w/2,my-10,w,20,5);ctx.fill();
      ctx.fillStyle=C.ink;ctx.fillText(L,mx,my+.5);

      if(bare)continue;
      var bs=Math.max(4.5,7.5*hs);
      ctx.fillStyle=C.surf;ctx.strokeStyle=C.miss;ctx.lineWidth=Math.max(1.2,1.8*hs);

      ctx.fillStyle=C.acc;ctx.beginPath();ctx.arc(SP.x,SP.y,6,0,6.284);ctx.fill();

      ctx.fillStyle=C.acc;ctx.beginPath();ctx.arc(SP.x,SP.y,13,0,6.284);ctx.fill();
      ctx.fillStyle=cssvar('--accent-ink');ctx.beginPath();ctx.arc(SP.x,SP.y,4.5,0,6.284);ctx.fill();
    }else{
      if(S.mode!=='open'&&!tiny){
        ctx.fillStyle=C.surf;ctx.strokeStyle=C.ink;ctx.lineWidth=1.5;
        ctx.beginPath();ctx.arc(SP.x,SP.y,8*hs,0,6.284);ctx.fill();ctx.stroke();
      }
      ctx.fillStyle=C.ink;
      ctx.beginPath();ctx.arc(SP.x,SP.y,Math.max(1.4,4.5*hs),0,6.284);ctx.fill();

     the way the paper one did */

    ctx.textAlign='left';ctx.textBaseline='middle';
    for(var gk=0;gk<S.pts.length;gk++){
      var gv=S.pts[gk].g;if(!gv)continue;
      var GP=W2S(S.pts[gk]),gt='\u2193'+showLen(gv);
      var gw=ctx.measureText(gt).width+10;
      ctx.fillStyle=C.surf;rr(GP.x+9,GP.y+4,gw,17,4);ctx.fill();
      ctx.strokeStyle=C.ink2;ctx.lineWidth=1;rr(GP.x+9,GP.y+4,gw,17,4);ctx.stroke();
      ctx.fillStyle=C.ink2;ctx.fillText(gt,GP.x+14,GP.y+13);

    ctx.fillStyle=C.acc;ctx.beginPath();ctx.arc(F0.x,F0.y,Math.max(4,9*hs),0,6.284);ctx.fill();

    ctx.fillText('TAP A CORNER OF THE HOUSE TO START',W/2,H/2-8);
    ctx.font='400 12px "IBM Plex Sans",sans-serif';

}

function snapPoint(p){
  if(!S.snap||!S.pts.length)return{x:Math.round(p.x),y:Math.round(p.y)};
  var L=S.pts[S.pts.length-1],dx=p.x-L.x,dy=p.y-L.y;
  var q;
  if(S.snap===90){
    q=Math.abs(dx)>=Math.abs(dy)?{x:L.x+dx,y:L.y}:{x:L.x,y:L.y+dy};
  }else{
    var len=Math.hypot(dx,dy),a=Math.round(Math.atan2(dy,dx)/(Math.PI/4))*(Math.PI/4);
    q={x:L.x+Math.cos(a)*len,y:L.y+Math.sin(a)*len};
  }
  /* line the new corner up with any corner already placed, so jogs come
     back flush with the wall they jog off. In square mode only the free
     coordinate moves, so the wall stays square. */
  var tol=16/V.s,bx=null,by=null,bdx=tol,bdy=tol;
  for(var i=0;i<S.pts.length;i++){
    var P=S.pts[i];
    if(Math.abs(q.x-P.x)<bdx){bdx=Math.abs(q.x-P.x);bx=P.x;}
    if(Math.abs(q.y-P.y)<bdy){bdy=Math.abs(q.y-P.y);by=P.y;}
  }
  if(S.snap===90){
    var horiz=Math.abs(q.y-L.y)<.5;
    if(horiz){if(bx!==null)q.x=bx;}else{if(by!==null)q.y=by;}
  }else{
    if(bx!==null)q.x=bx;
    if(by!==null)q.y=by;
  }
  return{x:Math.round(q.x),y:Math.round(q.y)};
}
function hitWall(p){
  var n=segCount(),best=-1,bt=0,bd=28;
  for(var i=0;i<n;i++){
    var s=seg(i),A=W2S(s[0]),B=W2S(s[1]),dx=B.x-A.x,dy=B.y-A.y,L2=dx*dx+dy*dy||1;
    var t=Math.max(0,Math.min(1,((p.x-A.x)*dx+(p.y-A.y)*dy)/L2));
    var d=Math.hypot(p.x-(A.x+t*dx),p.y-(A.y+t*dy));
    if(d<bd){bd=d;best=i;bt=t;}
  }
  return best<0?null:{wall:best,t:bt};
}
function hitOpening(p){
  var n=segCount(),best=-1,bd=20;
  for(var i=0;i<S.openings.length;i++){
    var o=S.openings[i];
    if(o.wall>=n)continue;
    var q=W2S(ptOn(o.wall,o.t)),d=Math.hypot(p.x-q.x,p.y-q.y);
    if(d<bd){bd=d;best=i;}

  var groups=alignGroups.filter(function(g){
    return !g.idx.some(function(j){return sel.indexOf(j)>=0;});
  }).concat([{axis:axis,target:target,idx:sel}]);
  var rows=[],i;
  for(i=0;i<M;i++){
    var a=i,b=(i+1)%N,d=dirOf(S.pts[a],S.pts[b]);
    if(!d)continue;
    /* A wall with both ends picked is the one being straightened, so it's
       free to swing onto the line. Every other wall keeps its angle. */
    var same=groups.some(function(g){
      return g.idx.indexOf(a)>=0&&g.idx.indexOf(b)>=0;
    });
    if(same)continue;
    rows.push(dirRow(a,b,d));
  }
  groups.forEach(function(g){
    g.idx.forEach(function(j){
      if(j<0||j>=N)return;
      rows.push({c:[[2*j+(g.axis==='y'?1:0),1]],rhs:g.target});
    });
  });
  if(!runSolve(rows))return false;
  alignGroups=groups;
  return true;
}
/* Pin one wall to a true 45 and let the rest of the outline settle around it.
   Everything else keeps the angle it already has. */
function force45(wi){
  var N=S.pts.length,M=segCount();
  if(wi<0||wi>=M)return 'bad';
  var a=wi,b=(wi+1)%N,cur=dirOf(S.pts[a],S.pts[b]);
  if(!cur)return 'bad';
  var k=Math.SQRT1_2,best=null;
  [{x:k,y:k},{x:k,y:-k},{x:-k,y:k},{x:-k,y:-k}].forEach(function(c){
    var dot=c.x*cur.x+c.y*cur.y;
    if(!best||dot>best.dot)best={dot:dot,dir:c};
  });
  var off=Math.acos(Math.max(-1,Math.min(1,best.dot)))*180/Math.PI;
  if(off>35)return 'far';
  var rows=[],i;
  for(i=0;i<M;i++){
    var p=i,q=(i+1)%N;
    var d=(i===wi)?best.dir:dirOf(S.pts[p],S.pts[q]);
    if(!d)continue;
    rows.push(dirRow(p,q,d));
  }
  alignGroups.forEach(function(g){
    g.idx.forEach(function(j){
      if(j<0||j>=N)return;
      rows.push({c:[[2*j+(g.axis==='y'?1:0),1]],rhs:g.target});
    });
  });
  return runSolve(rows)?'ok':'bad';
}
function alignSet(sel){
  if(sel.length<2)return;
  var xs=sel.map(function(i){return S.pts[i].x;}),
      ys=sel.map(function(i){return S.pts[i].y;});
  var spreadX=Math.max.apply(null,xs)-Math.min.apply(null,xs),
      spreadY=Math.max.apply(null,ys)-Math.min.apply(null,ys);
  var axis=spreadY<=spreadX?'y':'x';
  var target=median(axis==='y'?ys:xs);
  snapshot();
  if(!alignSolve(sel,axis,target)){
    if(hist.length)hist.pop();

  }
}

var sheet=document.getElementById('sheet'),fieldsEl=document.getElementById('fields'),

/* A measurement is kept as three separate pieces so a fraction can never
   run into the inches. 220 and a half is 22 ft, 0 in, 1/2 — never 2201/2. */
function fracTo16(fr){
  if(!fr)return 0;
  var p=(fr+'').split('/');
  if(p.length!==2)return 0;
  return Math.round(16*(parseFloat(p[0])||0)/(parseFloat(p[1])||1));
}
function reduce16(r){
  var den=16;
  while(r%2===0&&den>1){r/=2;den/=2;}
  return r+'/'+den;
}
function dimTo16(f){
  return ((parseInt(f.ft||0,10)||0)*12+(parseInt(f.inch||0,10)||0))*16+fracTo16(f.frac);
}
function isEmptyDim(f){
  return !((f.ft||'').trim()||(f.inch||'').trim()||(f.frac||'').trim());
}
/* Feet and inches, carrying any inches past 12 up into feet. */
function fmtFtIn(t16){
  var ti=Math.floor(t16/16),r=t16%16,ft=Math.floor(ti/12),inch=ti%12,out=[];
  if(ft)out.push(ft+"'");
  if(inch||r||!ft)out.push(inch+(r?' '+reduce16(r):'')+'"');
  return out.join(' ');
}
/* Straight inches, the way they were punched in. */
function fmtInches(t16){
  var ti=Math.floor(t16/16),r=t16%16;
  return ti+(r?' '+reduce16(r):'')+'"';
}
function units(){var j=cur();return (j&&j.units)||'ftin';}
/* One stored measurement as sixteenths, and sixteenths back out as text. */
function dim16(str){
  if(!str)return 0;

  return isEmptyDim(f)?0:dimTo16(f);
}
function fmt16(t){
  var neg=t<0;t=Math.abs(t);
  return (neg?'-':'')+(units()==='in'?fmtInches(t):fmtFtIn(t));
}
function fmtDim(f){
  if(isEmptyDim(f))return '';

  return units()==='in'?fmtInches(t):fmtFtIn(t);
}
/* Re-render a stored measurement in whichever unit is showing. */
function showLen(str){
  if(!str)return '';

  if(isEmptyDim(f))return str;
  var t=dimTo16(f);
  return units()==='in'?fmtInches(t):fmtFtIn(t);
}
function parseDim(str){
  var f={ft:'',inch:'',frac:''};
  if(!str)return f;
  var m=str.match(/(\d+)\s*'/); if(m)f.ft=m[1];
  var i=str.match(/(?:'|^)\s*(\d+)(?:\s+\d+\/\d+)?\s*"/); if(i)f.inch=i[1];
  else{var bare=str.match(/^\s*(\d+)\s*(?:\d+\/\d+)?\s*$/);if(bare&&!f.ft)f.inch=bare[1];}
  var fr=str.match(/(\d+\/\d+)\s*"?\s*$/); if(fr)f.frac=fr[1];
  return f;
}

/* A gap in a list is just a number; on the wall it is a place. This draws
   the wall end to end with its openings in order and marks the one span
   being typed, so there is no counting along the row to work out which. */
function spanSVG(w,row){
  var ix=wallOpenings(w),items=[];
  ix.forEach(function(oi,k){
    var o=S.openings[oi];
    items.push({t:'gap',slot:k,v:dim16(o.gap)});
    items.push({t:'op',oi:oi,v:dim16(o.w),g:kindGlyph(kindOf(o))});
  });

  var L=dim16(wallLen(w)),known=0,unk=0;
  items.forEach(function(it){if(it.v>0)known+=it.v;else unk++;});
  /* anything not measured yet gets a nominal share, so the strip still
     reads as a wall instead of collapsing */
  var share=(L>known&&unk)?(L-known)/unk:(known?known/items.length:1);
  var tot=0;
  items.forEach(function(it){it.wgt=it.v>0?it.v:Math.max(share,1);tot+=it.wgt;});
  if(!tot)return '';
  var X0=4,X1=96,SP=X1-X0,run=X0,parts=[],hit=null;
  items.forEach(function(it){

        'font-size="4" font-family="Barlow Condensed,sans-serif" font-weight="700" '+
        'fill="var(--accent-ink)">'+it.g+'</text>');
    }else if(it.slot===row.slot)hit=[a,b];
  });

  if(hit){
    var a=hit[0],b=hit[1],m=(a+b)/2;
    mark='<line x1="'+a.toFixed(2)+'" y1="13" x2="'+b.toFixed(2)+'" y2="13" stroke="var(--accent)" stroke-width="1.1"/>'+
      '<line x1="'+a.toFixed(2)+'" y1="10.4" x2="'+a.toFixed(2)+'" y2="15.6" stroke="var(--accent)" stroke-width="1.1"/>'+
      '<line x1="'+b.toFixed(2)+'" y1="10.4" x2="'+b.toFixed(2)+'" y2="15.6" stroke="var(--accent)" stroke-width="1.1"/>'+
      '<rect x="'+(a-0.4).toFixed(2)+'" y="3.6" width="'+(b-a+0.8).toFixed(2)+

    '<line x1="'+X0+'" y1="7" x2="'+X1+'" y2="7" stroke="var(--ink-2)" stroke-width="0.7"/>'+
    '<line x1="'+X0+'" y1="2.6" x2="'+X0+'" y2="11.4" stroke="var(--ink)" stroke-width="1.1"/>'+
    '<line x1="'+X1+'" y1="2.6" x2="'+X1+'" y2="11.4" stroke="var(--ink)" stroke-width="1.1"/>'+
    parts.join('')+mark+'</svg>'+

    if(gc&&!gc.need&&Math.abs(gc.diff)>32){
      out.push({pos:w+0.6,kind:'gap',w:w,
        title:'Spacing on wall '+(w+1)+' — '+fmt16(Math.abs(gc.diff))+(gc.diff>0?' over':' under'),
        why:'Gaps and opening widths don’t come to the wall length. Tap Estimated if you placed these by eye.'});
    }
  }
  out.sort(function(a,b){return a.pos-b.pos;});
  return out;
}
function openReview(){

    gl.forEach(function(q){line('Corner '+(q+1),showLen(S.pts[q].g),null,bad[q]);});
  }

        line(kindLabel(kindOf(o)),
          (o.w&&o.h)?showLen(o.w)+' × '+showLen(o.h):'',
          'wall '+(w2+1)+(o.sill?'  ·  sill '+showLen(o.sill):'')+(o.approx?'  ·  estimated':''));
      });

      var gc=gapCheck(w3);
      if(!gc)return;
      if(gc.need){line('Wall '+(w3+1),'',gc.need==='length'?'wall length not taken':'run not finished');return;}
      line('Wall '+(w3+1),gc.diff===0?'exact':fmt16(Math.abs(gc.diff))+(gc.diff>0?' over':' under'),
        wallApprox(w3)?'estimated':null,
        (!wallApprox(w3)&&Math.abs(gc.diff)>32));
    })(w3);}
  }

  sec('Heights');
  HEIGHTS.forEach(function(h){
    line(h.k,(h.k==='Roof pitch'?(S.heights[h.k]||''):showLen(S.heights[h.k])),h.note);
  });

    fmt16(Math.round(rc.pred))+'. You measured '+fmt16(rc.actual)+
    (Math.abs(rc.diff)>192?' — a fair way apart, worth a thought.':' — close enough.')));

}

function summaryText(){
  var out=[],j=cur();
  out.push('EXTERIOR MEASURE'+(j?' \u2014 '+j.name:''));
  out.push('All measurements shown in '+(units()==='in'?'inches':'feet and inches')+'.');
  (j&&j.shapes?j.shapes:[curShape()]).forEach(function(sh){
    withShape(sh,function(){
      var n=segCount();
      out.push('');
      out.push(sh.name.toUpperCase()+'  ('+n+' walls, in order walked)');
      for(var i=0;i<n;i++){
        out.push('  Wall '+(i+1)+'  '+(showLen(wallLen(i))||'— MISSING —'));
        wallOpenings(i).forEach(function(oi){
          var o=S.openings[oi];
          out.push('      '+kindLabel(kindOf(o))+'  '+
            ((o.w&&o.h)?showLen(o.w)+' w x '+showLen(o.h)+' h':'— MISSING —')+
            (o.sill?'  (sill '+showLen(o.sill)+')':'')+
            (o.approx?'   [estimated]':''));
        });
        var ch=gapChain(i);
        if(ch.length){
          out.push('      spacing from the top-left corner, edge to edge:'+
            ((S.walls[i]&&S.walls[i].approx)?'   [estimated]':''));
          ch.forEach(function(r){
            out.push('        '+r.from+' to '+r.to+'  '+(showLen(r.value)||'— MISSING —'));
          });
          var ck=gapCheck(i);
          if(ck&&!ck.need&&ck.diff!==0)
            out.push('        ** '+fmt16(Math.abs(ck.diff))+(ck.diff>0?' over':' under')+' the wall length **');
        }
      }
      var gl=[];
      for(var gi=0;gi<S.pts.length;gi++)
        if(S.pts[gi].g)gl.push('    Corner '+(gi+1)+'  '+showLen(S.pts[gi].g));
      if(gl.length){
        out.push('  GRADE below top of foundation');
        gl.forEach(function(x){out.push(x);});
      }
    });
  });
  out.push('');
  out.push('HEIGHTS');
  out.push('  (all measured from top of foundation, which runs level)');
  HEIGHTS.forEach(function(h){
    var v=(h.k==='Roof pitch')?(S.heights[h.k]||''):showLen(S.heights[h.k]);
    out.push('  '+h.k+'  '+(v||'— MISSING —'));
  });
  return out.join('\n');
}

    return 'Drawing locked \u2014 nothing can move. Measuring still works. Tap the padlock to edit again.';
  if(cutOn){
    if(!cutPicks.length)return 'Tap the corner a 45\u00b0 line starts from \u2014 or both ends of a wall to force that wall to 45\u00b0.';
    if(cutPicks.length===1)return 'Tap the wall the 45\u00b0 runs into, or the corner at the far end of this wall to straighten it to 45\u00b0.';
    return 'Tap the button to pin that wall to a true 45\u00b0.';
  }
  if(eraseOn)return 'Tap a wall to take it out. The two walls beside it run on until they meet.';
  if(jogOn)return 'Tap the wall where the jog belongs — it drops in '+(jogDir>0?'toward the house':'away from the house')+
    '. Tap the button again to flip it, or a third time to cancel.';
  if(alignOn)return alignSel.length<2
    ? 'Tap every corner you want to work on \u2014 a whole run of wall, jogs and all. Tap open paper to let them go.'
    : 'Drag a picked corner to slide all '+alignSel.length+' as one piece. Tap open paper when done, or the button to flatten them onto one line.';
  if(S.mode==='measure')return 'Tap a wall for its length, or a corner for its grade \u2014 how far the dirt sits below the top of the foundation. Drag a corner to stretch it.';
  if(S.mode==='open')return 'Tap a wall where a window or door sits to add one. Tap an opening already there to edit or remove it.';
  if(S.snap===90)return 'Tap to place a corner. Drag one onto its neighbour to join them. Drag anywhere else to move the paper.';
  if(S.snap===45)return 'Corners lock to 45\u00b0 steps for clipped corners and angled bays. Dragging a corner keeps every angle.';
  return 'Free angles \u2014 dragging a corner moves just that corner and will change the angles either side of it.';
}
var panelOpen=true;
function setMode(m){
  S.mode=m;
  if(m==='measure')S.tab='walls';
  else if(m==='open')S.tab='openings';
  panelOpen=(m!=='draw');
  [].forEach.call(document.querySelectorAll('.tab'),function(x){
    x.setAttribute('aria-selected',x.dataset.tab===S.tab?'true':'false');});
  [].forEach.call(document.querySelectorAll('.mode'),function(b){b.setAttribute('aria-pressed',b.dataset.mode===m?'true':'false');});
  render();
}
[].forEach.call(document.querySelectorAll('.mode'),function(b){b.addEventListener('click',function(){
  alignOn=false;alignSel=[];jogOn=false;
  setMode(b.dataset.mode);
});});
[].forEach.call(document.querySelectorAll('.tab'),function(b){b.addEventListener('click',function(){
  S.tab=b.dataset.tab;
  [].forEach.call(document.querySelectorAll('.tab'),function(x){x.setAttribute('aria-selected',x===b?'true':'false');});
  render();
});});
document.getElementById('close').addEventListener('click',closeShape);
document.getElementById('fit').addEventListener('click',fitView);
document.getElementById('lock').addEventListener('click',function(){
  S.locked=!S.locked;
  if(S.locked){alignOn=false;alignSel=[];jogOn=false;cutOn=false;cutPicks=[];eraseOn=false;}
  toolMsg='';render();
});
document.getElementById('cut').addEventListener('click',function(){
  if(cutOn&&cutPicks.length===2){
    var nn=S.pts.length,a=cutPicks[0],b=cutPicks[1],wi=-1;
    if(b===(a+1)%nn)wi=a; else if(a===(b+1)%nn)wi=b;
    if(wi<0){say('Those two corners aren\u2019t the ends of one wall. Pick a corner and the one next to it.');}
    else{
      snapshot();
      var r=force45(wi);
      if(r==='ok'){cutOn=false;cutPicks=[];toolMsg='';}
      else{
        if(hist.length)hist.pop();
        say(r==='far'
          ? 'That wall is too far off 45\u00b0 for this to be a correction. Drag it closer first, or redraw it.'
          : 'That wall can\u2019t be pinned to 45\u00b0 without bending something else.');
      }
    }
    render();return;
  }
  if(cutOn){cutOn=false;cutPicks=[];}
  else{cutOn=true;cutPicks=[];alignOn=false;alignSel=[];jogOn=false;eraseOn=false;}
  render();
});
document.getElementById('erase').addEventListener('click',function(){
  if(eraseOn)eraseOn=false;
  else{eraseOn=true;cutOn=false;cutPicks=[];alignOn=false;alignSel=[];jogOn=false;}
  render();
});
document.getElementById('jog').addEventListener('click',function(){
  if(!jogOn){jogOn=true;jogDir=1;alignOn=false;alignSel=[];cutOn=false;cutPicks=[];eraseOn=false;}
  else if(jogDir>0){jogDir=-1;}
  else{jogOn=false;}
  render();
});
document.getElementById('align').addEventListener('click',function(){
  if(alignOn){
    if(alignSel.length>=2)alignSet(alignSel);
    alignOn=false;alignSel=[];
  }else{alignOn=true;alignSel=[];jogOn=false;cutOn=false;cutPicks=[];eraseOn=false;}
  render();
});
document.getElementById('status').addEventListener('click',function(){panelOpen=!panelOpen;render();});
document.getElementById('findbtn').addEventListener('click',function(){
  if(document.getElementById('findbtn').dataset.mode==='check')openReview();
  else goToBlank();
});
document.getElementById('revclose').addEventListener('click',closeReview);
document.getElementById('backbtn').addEventListener('click',function(){
  if(!measHist.length){say('Nothing to step back — no measurements entered yet this session.');render();return;}
  measBack();
});
document.getElementById('revbtn').addEventListener('click',function(){
  nextDir=-nextDir;render();
  if(document.getElementById('revbtn').className!=='off')goToBlank();
});
document.getElementById('snap').addEventListener('click',function(){
  S.snap=S.snap===90?45:(S.snap===45?0:90);
  render();
});
function doUndo(){
  undo();
  S.openings=S.openings.filter(function(o){return o.wall<segCount();});
  if(alignOn){alignOn=false;alignSel=[];}
  render();
}
document.getElementById('undo').addEventListener('click',function(){
  if(S.locked){
    say('The drawing is locked \u2014 Undo can\u2019t roll it back. Tap the padlock first.');
    render();return;
  }
  if(!hist.length)return;
  var now=filledNow(),was=filledIn(hist[hist.length-1]);
  if(was>=0&&was<now){
    var lost=now-was;
    confirmBox('This would clear measurements',
      'Stepping back that far takes out '+lost+' wall measurement'+(lost>1?'s':'')+
      ' you have already taken. The shape and its lengths move together, so they go with it.',
      'Undo anyway',doUndo);
    return;
  }
  doUndo();
});
document.getElementById('redo').addEventListener('click',function(){
  if(S.locked){
    say('The drawing is locked \u2014 tap the padlock before stepping the drawing forward.');
    render();return;
  }
  redo();
  S.openings=S.openings.filter(function(o){return o.wall<segCount();});
  render();
});
var modal=document.getElementById('modal'),mbox=document.getElementById('modalbox'),pendingDel=null;
modal.addEventListener('click',function(e){if(e.target===modal)closeModal();});
function closeModal(){modal.hidden=true;mbox.innerHTML='';pendingDel=null;}
function jobStats(j){
  var n=(!j.pts||j.pts.length<2)?0:(j.closed?j.pts.length:j.pts.length-1);
  var done=0;for(var i=0;i<n;i++)if(j.walls&&j.walls[i]&&j.walls[i].len)done++;
  var hd=HEIGHTS.filter(function(h){return j.heights&&j.heights[h.k];}).length;
  if(!n)return'Nothing drawn yet';
  return done+'/'+n+' walls · '+hd+'/'+HEIGHTS.length+' heights · '+
    new Date(j.updated||Date.now()).toLocaleDateString(undefined,{month:'numeric',day:'numeric'});
}
function switchTo(i){save();DB.active=i;intoState();closeModal();setMode(S.closed?'measure':'draw');fitView();render();}
function confirmBox(title,msg,okLabel,onOk){
  pendingDel=null;modal.hidden=false;mbox.innerHTML='';
  mbox.appendChild(el('div','mtitle',title));
  var box=el('div','confirm');
  box.appendChild(el('div','warn',msg));
  mbox.appendChild(box);
  var row=el('div','crow');
  var no=el('button','mbtn msecondary','Leave it alone');
  no.addEventListener('click',closeModal);
  var yes=el('button','mbtn mdanger',okLabel);
  yes.addEventListener('click',function(){closeModal();onOk();});
  row.appendChild(no);row.appendChild(yes);mbox.appendChild(row);
}
function openJobs(){
  pendingDel=null;modal.hidden=false;mbox.innerHTML='';
  mbox.appendChild(el('div','mtitle','Jobs'));
  DB.jobs.forEach(function(j,i){
    if(pendingDel===j.id)return;
    var row=el('div','jrow'+(i===DB.active?' jcur':''));
    var open=el('button','jopen');
    open.innerHTML='<b></b><small></small>';
    open.querySelector('b').textContent=j.name+(i===DB.active?'  ·  open':'');
    open.querySelector('small').textContent=jobStats(j);
    open.addEventListener('click',function(){if(i!==DB.active)switchTo(i);else closeModal();});
    var del=el('button','jdel','✕');
    del.setAttribute('aria-label','Delete '+j.name);
    del.addEventListener('click',function(){pendingDel=j.id;drawConfirm(j,i);});
    row.appendChild(open);row.appendChild(del);mbox.appendChild(row);
  });
  mbox.appendChild(el('div','sub','Show measurements as'));
  var ur=el('div','crow');
  [['ftin','Feet & inches'],['in','Inches']].forEach(function(u){
    var b=el('button','mbtn '+(units()===u[0]?'mprimary':'msecondary'),u[1]);
    b.addEventListener('click',function(){cur().units=u[0];save();render();openJobs();});
    ur.appendChild(b);
  });
  mbox.appendChild(ur);
  var mk=el('button','mbtn mprimary','New job');
  mk.addEventListener('click',function(){openName(null);});
  var rn=el('button','mbtn msecondary','Rename this job');
  rn.addEventListener('click',function(){openName(cur());});
  var cl=el('button','mbtn msecondary','Close');
  cl.addEventListener('click',closeModal);
  mbox.appendChild(mk);mbox.appendChild(rn);mbox.appendChild(cl);
}
function drawConfirm(j,i){
  modal.hidden=false;mbox.innerHTML='';
  mbox.appendChild(el('div','mtitle','Delete job'));
  var box=el('div','confirm');
  var w=el('div','warn');
  w.innerHTML='<b>This cannot be undone.</b>';
  var w2=el('div','warn');
  w2.textContent='“'+j.name+'” — '+jobStats(j)+'. The drawing and every measurement on it go with it.';
  box.appendChild(w);box.appendChild(w2);
  var row=el('div','crow');
  var no=el('button','mbtn msecondary','Keep it');
  no.addEventListener('click',openJobs);
  var yes=el('button','mbtn mdanger','Delete');
  yes.addEventListener('click',function(){
    DB.jobs.splice(i,1);
    if(!DB.jobs.length)DB.jobs.push(blankJob('Job 1'));
    if(DB.active>=DB.jobs.length)DB.active=DB.jobs.length-1;
    else if(i<DB.active)DB.active--;
    intoState();
    try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}
    setMode(S.closed?'measure':'draw');fitView();render();openJobs();
  });
  row.appendChild(no);row.appendChild(yes);box.appendChild(row);
  mbox.appendChild(box);
}
function openName(job){
  modal.hidden=false;mbox.innerHTML='';
  mbox.appendChild(el('div','mtitle',job?'Rename job':'New job'));
  var inp=document.createElement('input');
  inp.type='text';inp.id='jobnameinput';
  inp.placeholder='e.g. Kelly Garage · exterior';
  inp.value=job?job.name:'Job '+(DB.jobs.length+1);
  mbox.appendChild(inp);
  var row=el('div','crow');
  var no=el('button','mbtn msecondary','Cancel');
  no.addEventListener('click',openJobs);
  var ok=el('button','mbtn mprimary',job?'Save name':'Create');
  ok.addEventListener('click',function(){
    var nm=(inp.value||'').trim()||(job?job.name:'Job '+(DB.jobs.length+1));
    if(job){job.name=nm;save();closeModal();render();}
    else{save();var nj=blankJob(nm);DB.jobs.push(nj);DB.active=DB.jobs.length-1;
      intoState();closeModal();setMode('draw');fitView();render();}
  });
  row.appendChild(no);row.appendChild(ok);mbox.appendChild(row);
  setTimeout(function(){try{inp.focus();inp.select();}catch(e){}},60);
}
document.getElementById('jobbtn').addEventListener('click',openJobs);

function switchShape(i){save();cur().active=i;intoState();setMode(S.closed?'measure':'draw');render();}
function addShape(){
  var j=cur(),used=j.shapes.map(function(x){return x.name.toLowerCase();});
  var guess=['Patio','Deck','Garage','Porch'].filter(function(x){return used.indexOf(x.toLowerCase())<0;})[0]
            ||('Shape '+(j.shapes.length+1));
  openShapeName(null,guess);
}
function openShapeName(sh,guess){
  modal.hidden=false;mbox.innerHTML='';
  mbox.appendChild(el('div','mtitle',sh?'Rename outline':'New outline'));
  var inp=document.createElement('input');
  inp.type='text';inp.id='jobnameinput';inp.placeholder='e.g. Patio';
  inp.value=sh?sh.name:guess;
  mbox.appendChild(inp);
  var row=el('div','crow');
  var no=el('button','mbtn msecondary','Cancel');
  no.addEventListener('click',function(){closeModal();render();});
  var ok=el('button','mbtn mprimary',sh?'Save name':'Start drawing');
  ok.addEventListener('click',function(){
    var nm=(inp.value||'').trim()||(sh?sh.name:guess);
    var j=cur();
    if(sh){sh.name=nm;save();closeModal();render();}
    else{save();j.shapes.push(blankShape(nm));j.active=j.shapes.length-1;
      intoState();closeModal();setMode('draw');render();}
  });
  row.appendChild(no);row.appendChild(ok);mbox.appendChild(row);
  setTimeout(function(){try{inp.focus();inp.select();}catch(e){}},60);
}
function openShapeMenu(sh,i){
  modal.hidden=false;mbox.innerHTML='';
  mbox.appendChild(el('div','mtitle',sh.name));
  var info=el('div','warn');
  var nseg=shapeSegs(sh),nd=0;
  for(var k=0;k<nseg;k++)if(sh.walls&&sh.walls[k]&&sh.walls[k].len)nd++;
  info.textContent=nseg?nd+' of '+nseg+' walls measured.':'Nothing drawn on this outline yet.';
  mbox.appendChild(info);
  var rn=el('button','mbtn msecondary','Rename');
  rn.addEventListener('click',function(){openShapeName(sh);});
  mbox.appendChild(rn);
  if(cur().shapes.length>1){
    var dl=el('button','mbtn mdanger','Delete this outline');
    dl.addEventListener('click',function(){
      mbox.innerHTML='';
      mbox.appendChild(el('div','mtitle','Delete outline'));
      var w=el('div','warn');w.innerHTML='<b>This cannot be undone.</b>';
      var w2=el('div','warn');
      w2.textContent='“'+sh.name+'” and every measurement on it will be removed. The rest of the job stays.';
      mbox.appendChild(w);mbox.appendChild(w2);
      var r2=el('div','crow');
      var keep=el('button','mbtn msecondary','Keep it');
      keep.addEventListener('click',function(){openShapeMenu(sh,i);});
      var go=el('button','mbtn mdanger','Delete');
      go.addEventListener('click',function(){
        var j=cur();j.shapes.splice(i,1);
        if(j.active>=j.shapes.length)j.active=j.shapes.length-1;
        else if(i<j.active)j.active--;
        intoState();closeModal();setMode(S.closed?'measure':'draw');render();
      });
      r2.appendChild(keep);r2.appendChild(go);mbox.appendChild(r2);
    });
    mbox.appendChild(dl);
  }
  var cl=el('button','mbtn msecondary','Close');
  cl.addEventListener('click',function(){closeModal();render();});
  mbox.appendChild(cl);
}
function drawShapeBar(){
  var bar=document.getElementById('shapebar'),j=cur();
  bar.innerHTML='';
  if(!j)return;
  curShape();
  j.shapes.forEach(function(sh,i){
    var c=el('button','chip'+(i===j.active?' on':''),sh.name);
    c.addEventListener('click',function(){
      if(i===j.active)openShapeMenu(sh,i);else switchShape(i);
    });
    bar.appendChild(c);
  });
  var add=el('button','chip add','+ Outline');
  add.addEventListener('click',addShape);
  bar.appendChild(add);
}

intoState();
setMode(S.pts.length&&S.closed?'measure':'draw');
fit();
initCloud();

/* Tapping the header status opens sign-in, or shows who is signed in. */
(function(){
  var s=document.getElementById('sync');
  if(s){s.style.cursor='pointer';
    s.addEventListener('click',function(){ if(window.FMStore) FMStore.prompt(); });}
})();

/* Offline support. Registered last so a failure here cannot stop the app. */
if('serviceWorker' in navigator){
  addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(e){console.log('[FM] sw',e);});
  });
}
</script>
